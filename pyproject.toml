[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "personal-stock-analysis"
version = "0.1.0"
description = "Evidence-bound, calibrated personal stock analysis for an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "akshare>=1.17",
  "chronos-forecasting>=2.0,<3",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "torch>=2.5,<3",
  "typer>=0.15,<1",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
# 保留旧 extra 名称兼容已有安装命令；完整运行依赖现已默认安装。
data = []
forecast = []
charts = []
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
stock = "stock_analysis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analysis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

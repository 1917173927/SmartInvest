[risk]
max_portfolio_drawdown = 0.25
core_position_limit = 0.35
satellite_position_limit = 0.15
sector_limit = 0.60
cash_floor = 0.05
short_trade_risk = 0.01

[investor]
base_currency = "CNY"
capital_is_surplus = true
uses_leverage = false
minimum_horizon_years = 3

[portfolio]
# 必须填写券商账户的真实总资产；stock size 不再静默假设为 100000。
# cn_account_assets = 51546.80
# cn_account_assets_as_of = "2026-09-01"
# hk_account_assets = 6500.00
# hk_account_assets_as_of = "2026-09-01"
# us_account_assets = 1178.08
# us_account_assets_as_of = "2026-09-01"

[forecast]
model_id = "amazon/chronos-2"
device = "cpu"
minimum_history_days = 756
context_length = 512
initial_chronos_weight = 0.50
minimum_calibration_samples = 100
disable_after_consecutive_losses = 60

[research]
event_whitelist = [
  "earnings",
  "guidance",
  "policy",
  "management",
  "regulatory_legal",
  "commodity",
  "capital_allocation",
]

[automation]
use_llm = true
use_chronos = true
sync_lookback_years = 5
evidence_dirs = ["07-研究资料"]
auto_calibrate = true
calibration_horizons = [5, 10, 20, 60, 120]
calibration_max_windows = 100
calibration_step = 1
calibration_cooldown_days = 7
calibration_jobs_per_run = 1
news_refresh_hours = 12
macro_refresh_hours = 24
max_runtime_minutes = 20

[macro]
enabled = true
series = ["WTI", "GOLD", "DXY", "US10Y", "SHIBOR", "CSI300"]

[charts]
enabled = true
format = "svg"
include_macd = true
include_rsi = true
include_volume = true
include_levels = true
level_lookback_sessions = 360
level_max_per_side = 2
validate_levels = true
level_validation_horizon = 20
level_validation_step = 10
level_validation_max_windows = 60
include_probability_fan = true

# 复制本段增加自己的标的。真实配置被 .gitignore 排除。
[assets."CN:601318"]
name = "中国平安"
sector = "金融"
role = "core"
current_shares = 0 # 按券商当前持仓更新；stock size 会先扣除已有仓位
valuation_model = "insurer"
fair_pe = 10.5
fair_pb = 1.25
